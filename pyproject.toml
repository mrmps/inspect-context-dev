[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "inspect-context-dev"
version = "0.1.0"
description = "Context.dev web search tools for Inspect AI evaluations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "anyio>=4.9",
  "httpx>=0.28.1",
  "inspect-ai>=0.3.290",
  "pydantic>=2.11",
  "tenacity>=9",
]

[project.entry-points.inspect_ai]
inspect_context_dev = "inspect_context_dev._registry"

[dependency-groups]
dev = ["build>=1.2", "mypy>=1.18", "pytest>=8.4", "ruff>=0.14", "trio>=0.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: calls the real Context.dev API and consumes credits"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true

